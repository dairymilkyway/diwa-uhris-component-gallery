name: Publish @diwauhris/ui to npm

# Triggers on every push to main.
# Automatically bumps patch version, creates a git tag, and publishes to npm.
on:
  push:
    branches:
      - main

# Grant the workflow write permission to push the version bump commit back
permissions:
  contents: write

jobs:
  publish:
    name: Version bump, build, and publish
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout with full history and write access
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Set up Node.js with npm registry configured
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # 3. Configure git identity for the version commit
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Bump patch version (updates package.json only, no commit yet)
      - name: Bump patch version
        run: npm version patch --no-git-tag-version

      # 6. Read the new version for use in later steps
      - name: Read new version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # 7. Build the library — ESM + CJS + CSS + type declarations
      #    tsc -b runs internally; build failure = type errors caught here
      - name: Build library
        run: npm run build:lib

      # 8. Commit version bump, tag, and push
      - name: Commit and tag
        run: |
          git add package.json package-lock.json
          git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]"
          git tag v${{ steps.version.outputs.version }}
          git push origin main --follow-tags

      # 9. Publish to npm
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
